<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="theme-color" content="#040817"><link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 64 64%22%3E%3Crect width=%2264%22 height=%2264%22 rx=%2214%22 fill=%22%23040817%22/%3E%3Cpath d=%22M16 36c9-14 23-18 34-8-10 1-16 6-18 16-5-6-10-8-16-8Z%22 fill=%22%2368f0df%22/%3E%3C/svg%3E"><title>몽류 SS · Dream Tide</title><style>html,body{margin:0;width:100%;height:100%;display:grid;place-items:center;background:#030611;color:#dff;font:600 14px system-ui}.l{text-align:center;letter-spacing:.16em}i{display:block;width:180px;height:6px;margin:18px auto;border-radius:9px;background:linear-gradient(90deg,#2ab5c6,#6bf2df,#ffd66f);animation:p 1s ease-in-out infinite alternate;transform-origin:left}@keyframes p{to{transform:scaleX(.28);opacity:.55}}</style></head><body><div class="l">MONGRYU SS LOADING<i></i><small id="s">0%</small></div><script>(async()=>{try{const files=['bundle-v3/000.txt?v=3','bundle-v3/001.txt?v=3','bundle-v3/002.txt?v=3','bundle-v3/003.txt?v=3','bundle-v3/004.txt?v=3','bundle-v3/005.txt?v=3','bundle-v3/006.txt?v=3','bundle-v3/007.txt?v=3','bundle-v3/008.txt?v=3','bundle-v3/009.txt?v=3','bundle-v3/010.txt?v=3'];const parts=[];for(let i=0;i<files.length;i++){const r=await fetch(files[i],{cache:'no-store'});if(!r.ok)throw new Error('bundle '+r.status);parts.push(await r.text());document.getElementById('s').textContent=Math.round((i+1)/files.length*100)+'%'}const html=parts.join('');document.open();document.write(html);document.close()}catch(e){document.body.innerHTML='<pre style="white-space:pre-wrap;color:#ff9cab">LOAD FAILED\n'+String(e)+'</pre>'}})();</script></body></html>
